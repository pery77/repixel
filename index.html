<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10141c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>RePixel</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<!-- El texto de la pantalla no está aquí: cada sitio donde va texto lleva su
     clave en data-i18n (o data-i18n-title / data-i18n-ph para el atributo) y lo
     rellena aplicarIdioma() desde idiomas.js. Aquí solo queda la estructura. -->

<div id="app">
  <header>
    <h1>RePixel</h1>
    <p data-i18n="app.lema"></p>
    <span style="flex:1"></span>
    <select id="sel-idioma" class="idioma" title="Language"></select>
  </header>

  <div class="columnas">
    <!-- ==================== Columna izquierda: carga + herramientas ==================== -->
    <div class="columna-herramientas">
      <div class="fila" id="barra-herramientas">
        <strong data-i18n="herr.titulo"></strong>
        <span style="flex:1"></span>
        <button class="boton icono" id="btn-plegar-todo"></button>
      </div>

      <div class="tarjetas">
        <div class="tarjeta" id="tarjeta-imagenes">
          <div class="cabecera"><strong data-i18n="img.titulo"></strong></div>
          <div class="cuerpo">
            <div id="zona-soltar" data-i18n="img.soltar"></div>
            <div class="fila">
              <button class="boton icono" id="btn-archivos" data-icono="imagenes" data-i18n-title="img.archivosTitulo"></button>
              <button class="boton icono" id="btn-carpeta" data-icono="carpeta" data-i18n-title="img.carpetaTitulo"></button>
              <button class="boton icono" id="btn-limpiar" data-icono="vaciar" data-i18n-title="img.vaciarTitulo"></button>
            </div>
            <input type="file" id="input-archivos" accept="image/*" multiple hidden>
            <input type="file" id="input-carpeta" webkitdirectory hidden>
            <div id="lista-miniaturas"></div>
          </div>
        </div>

        <div class="tarjeta" id="tarjeta-fondo">
          <label class="cabecera">
            <input type="checkbox" id="chk-fondo">
            <span class="paso">1</span><strong>ReFondo</strong>
          </label>
          <div class="cuerpo">
            <div class="nota" data-i18n="fondo.nota"></div>
            <div class="fila">
              <label style="width:78px" data-i18n="fondo.cuando"></label>
              <select id="sel-fondo-orden">
                <option value="antes" data-i18n="fondo.antes"></option>
                <option value="despues" data-i18n="fondo.despues"></option>
              </select>
            </div>
            <div class="nota" data-i18n="fondo.notaOrden"></div>
            <div class="fila">
              <label style="width:78px" data-i18n="fondo.color"></label>
              <select id="sel-fondo-color">
                <option value="auto" data-i18n="fondo.auto"></option>
                <option value="manual" data-i18n="fondo.manual"></option>
              </select>
              <input type="color" id="in-fondo-color" value="#000000" data-i18n-title="fondo.colorTitulo">
              <button class="boton icono" id="btn-fondo-tomar" data-icono="cuentagotas" data-i18n-title="fondo.tomarTitulo"></button>
            </div>
            <div class="fila">
              <label style="width:78px" data-i18n="fondo.alcance"></label>
              <select id="sel-fondo-alcance">
                <option value="fuera" data-i18n="fondo.fuera"></option>
                <option value="todo" data-i18n="fondo.todo"></option>
              </select>
            </div>
            <div class="fila"><label style="width:78px" data-i18n="fondo.tolerancia"></label><input type="range" id="sl-fondo-tolerancia" min="0" max="100" value="8"><output id="out-fondo-tolerancia">8</output></div>
            <div class="fila"><label style="width:78px" data-i18n="fondo.desvanecer"></label><input type="range" id="sl-fondo-desvanecer" min="0" max="100" value="0"><output id="out-fondo-desvanecer">0</output></div>
            <div class="nota" data-i18n="fondo.notaFade"></div>
          </div>
        </div>

        <div class="tarjeta" id="tarjeta-resize">
          <label class="cabecera">
            <input type="checkbox" id="chk-resize" checked>
            <span class="paso">2</span><strong>ReSize</strong>
          </label>
          <div class="cuerpo">
            <div class="fila">
              <label data-i18n="resize.tamano"></label>
              <input type="number" id="in-ancho" min="1" max="4096" value="64"> ×
              <input type="number" id="in-alto" min="1" max="4096" value="64"> px
            </div>
            <div class="fila" id="tamanos-rapidos"><label data-i18n="resize.rapido"></label></div>
            <div class="fila">
              <label><input type="checkbox" id="chk-proporcion" checked> <span data-i18n="resize.proporcion"></span></label>
            </div>
            <div class="fila">
              <label data-i18n="resize.metodo"></label>
              <select id="sel-metodo-resize">
                <option value="area" data-i18n="resize.area"></option>
                <option value="vecino" data-i18n="resize.vecino"></option>
              </select>
            </div>
            <div class="fila">
              <label><input type="checkbox" id="chk-alfa-dura" checked> <span data-i18n="resize.alfaDura"></span></label>
            </div>
            <div class="fila">
              <label style="width:78px" data-i18n="resize.umbral"></label>
              <input type="range" id="sl-alfa-umbral" min="1" max="255" value="128"><output id="out-alfa-umbral">128</output>
            </div>
            <div class="nota" data-i18n="resize.notaAlfa"></div>
          </div>
        </div>

        <div class="tarjeta" id="tarjeta-ver">
          <label class="cabecera">
            <input type="checkbox" id="chk-ver" checked>
            <span class="paso">3</span><strong>ReVer</strong>
          </label>
          <div class="cuerpo">
            <div class="nota" data-i18n="ver.nota"></div>

            <div class="bloque">
              <div class="cabecera-bloque"><strong data-i18n="ver.canalColor"></strong></div>
              <div class="cuerpo-bloque">
                <div class="fila"><label style="width:78px" data-i18n="ver.brillo"></label><input type="range" id="sl-ver-brillo" min="-100" max="100" value="0"><output id="out-ver-brillo">0</output></div>
                <div class="fila"><label style="width:78px" data-i18n="ver.contraste"></label><input type="range" id="sl-ver-contraste" min="-100" max="100" value="0"><output id="out-ver-contraste">0</output></div>
                <div class="fila"><label style="width:78px" data-i18n="ver.saturacion"></label><input type="range" id="sl-ver-saturacion" min="-100" max="100" value="0"><output id="out-ver-saturacion">0</output></div>
                <div class="fila"><label style="width:78px" data-i18n="ver.tono"></label><input type="range" id="sl-ver-tono" min="-180" max="180" value="0"><output id="out-ver-tono">0</output></div>
                <div class="fila"><button class="boton icono" id="btn-reset-ajustes" data-icono="restablecer" data-i18n-title="ver.restablecerTitulo"></button></div>
              </div>
            </div>

            <div class="bloque" id="bloque-bordes">
              <label class="cabecera-bloque">
                <input type="checkbox" id="chk-bordes" checked><strong data-i18n="ver.canalBordes"></strong>
              </label>
              <div class="cuerpo-bloque">
                <div class="fila">
                  <label style="width:78px" data-i18n="ver.metodo"></label>
                  <select id="sel-bordes-metodo">
                    <option value="sobel" data-i18n="ver.sobel"></option>
                    <option value="laplaciano" data-i18n="ver.laplaciano"></option>
                    <option value="color" data-i18n="ver.difColor"></option>
                  </select>
                </div>
                <div class="fila"><label style="width:78px" data-i18n="ver.umbral"></label><input type="range" id="sl-bordes-umbral" min="0" max="255" value="24"><output id="out-bordes-umbral">24</output></div>
                <div class="fila"><label><input type="checkbox" id="chk-bordes-silueta" checked> <span data-i18n="ver.silueta"></span></label></div>
                <div class="fila">
                  <label style="width:78px" data-i18n="ver.influye"></label>
                  <select id="sel-bordes-modo">
                    <option value="oscurecer" data-i18n="ver.oscurecer"></option>
                    <option value="aclarar" data-i18n="ver.aclarar"></option>
                    <option value="realce" data-i18n="ver.realce"></option>
                  </select>
                </div>
                <div class="fila"><label style="width:78px" data-i18n="ver.influencia"></label><input type="range" id="sl-bordes-influencia" min="0" max="100" value="35"><output id="out-bordes-influencia">35</output></div>
                <div class="nota" data-i18n="ver.notaBordes"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="tarjeta" id="tarjeta-paleta">
          <label class="cabecera">
            <input type="checkbox" id="chk-paleta" checked>
            <span class="paso">4</span><strong>RePalette</strong>
          </label>
          <div class="cuerpo">
            <div class="fila">
              <input type="text" id="in-paleta" data-i18n-ph="paleta.entrada" spellcheck="false">
              <button class="boton icono" id="btn-cargar-paleta" data-icono="descargar" data-i18n-title="paleta.cargarTitulo"></button>
            </div>
            <div class="fila">
              <button class="boton icono" id="btn-paleta-archivo" data-icono="archivo" data-i18n-title="paleta.archivoTitulo"></button>
              <span class="nota" data-i18n="paleta.formatos"></span>
            </div>
            <input type="file" id="input-paleta" accept=".gpl,.pal,.hex,.txt,.act,.png,.gif,.bmp,.webp,image/*" hidden>
            <div id="paletas-recientes"></div>
            <div id="nombre-paleta"></div>
            <div id="muestras-paleta"></div>
            <div class="fila">
              <label data-i18n="paleta.distancia"></label>
              <select id="sel-metrica">
                <option value="oklab" data-i18n="paleta.oklab"></option>
                <option value="rgb" data-i18n="paleta.rgb"></option>
              </select>
            </div>
            <div class="fila">
              <label data-i18n="paleta.dithering"></label>
              <select id="sel-dither">
                <option value="ninguno" data-i18n="paleta.ninguno"></option>
                <option value="floyd">Floyd–Steinberg</option>
                <option value="bayer" data-i18n="paleta.bayer"></option>
              </select>
            </div>
            <div class="fila">
              <label style="width:72px" data-i18n="paleta.intensidad"></label>
              <input type="range" id="sl-intensidad" min="0" max="100" value="100"><output id="out-intensidad">100</output>
            </div>
          </div>
        </div>

        <div class="tarjeta" id="tarjeta-bloques">
          <label class="cabecera">
            <input type="checkbox" id="chk-bloques">
            <span class="paso">5</span><strong>ReBloques</strong>
          </label>
          <div class="cuerpo">
            <div class="nota" data-i18n="bloques.nota"></div>
            <div class="fila">
              <label style="width:78px" data-i18n="bloques.maquina"></label>
              <select id="sel-bloques-maquina">
                <option value="spectrum" data-i18n="bloques.spectrum"></option>
                <option value="msx" data-i18n="bloques.msx"></option>
                <option value="nes" data-i18n="bloques.nes"></option>
                <option value="medida" data-i18n="bloques.medida"></option>
              </select>
            </div>
            <div class="fila">
              <label style="width:78px" data-i18n="bloques.bloque"></label>
              <input type="number" id="in-bloques-ancho" min="1" max="256" value="8"> ×
              <input type="number" id="in-bloques-alto" min="1" max="256" value="8"> px
            </div>
            <div class="fila">
              <label style="width:78px" data-i18n="bloques.colores"></label>
              <input type="number" id="in-bloques-colores" min="1" max="64" value="2"> <span data-i18n="bloques.porBloque"></span>
            </div>
            <div class="fila">
              <label style="width:78px" data-i18n="bloques.elegir"></label>
              <select id="sel-bloques-criterio">
                <option value="error" data-i18n="bloques.error"></option>
                <option value="frecuencia" data-i18n="bloques.frecuencia"></option>
              </select>
            </div>
            <div class="nota" data-i18n="bloques.notaCriterio"></div>
          </div>
        </div>

        <div class="tarjeta" id="tarjeta-mascaras">
          <label class="cabecera">
            <input type="checkbox" id="chk-mascaras">
            <span class="paso">6</span><strong data-i18n="mascaras.titulo"></strong>
          </label>
          <div class="cuerpo">
            <div class="nota" data-i18n="mascaras.nota"></div>
            <div id="bloques-mascaras"></div>
            <div class="fila"><button class="boton icono" id="btn-reset-mascaras" data-icono="restablecer" data-i18n-title="mascaras.restablecerTitulo"></button></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== Columna derecha: vista previa + descarga ==================== -->
    <div class="columna-vista">
      <div class="tarjeta vista-principal">
        <div class="fila" id="controles-zoom">
          <strong data-i18n="vista.titulo"></strong>
          <button class="boton icono" id="btn-zoom-menos" data-icono="zoomMenos" data-i18n-title="vista.alejar"></button>
          <button class="boton icono" id="btn-zoom-mas" data-icono="zoomMas" data-i18n-title="vista.acercar"></button>
          <button class="boton icono" id="btn-zoom-ajustar" data-icono="ajustar" data-i18n-title="vista.ajustarTitulo"></button>
          <span class="nota" id="nivel-zoom"></span>
          <span style="flex:1"></span>
          <span class="nota" data-i18n="vista.ayuda"></span>
        </div>
        <div class="visores" style="margin-top:10px">
          <div class="visor">
            <h3 data-i18n="vista.original"></h3>
            <div class="marco"><canvas id="canvas-original"></canvas></div>
            <div class="info" id="info-original"></div>
          </div>
          <div class="visor">
            <h3 data-i18n="vista.resultado"></h3>
            <div class="marco"><canvas id="canvas-resultado"></canvas></div>
            <div class="info" id="info-resultado"></div>
          </div>
        </div>
      </div>

      <div class="vistas-extra" id="vistas-extra">
        <div class="tarjeta" id="vista-fondo">
          <div class="fila">
            <strong data-i18n="vista.fondoTitulo"></strong>
            <span class="nota" data-i18n="vista.fondoNota"></span>
          </div>
          <div class="visores-mini">
            <div class="visor">
              <h3 data-i18n="vista.fondoMapa"></h3>
              <div class="marco"><canvas id="canvas-fondo-mapa"></canvas></div>
            </div>
            <div class="visor">
              <h3 data-i18n="vista.fondoSin"></h3>
              <div class="marco"><canvas id="canvas-fondo-sin"></canvas></div>
            </div>
          </div>
          <div class="info" id="info-fondo"></div>
        </div>

        <div class="tarjeta" id="vista-ver">
          <div class="fila">
            <strong data-i18n="vista.verTitulo"></strong>
          </div>
          <div class="visores-mini">
            <div class="visor">
              <h3 data-i18n="vista.verColor"></h3>
              <div class="marco"><canvas id="canvas-ver-color"></canvas></div>
            </div>
            <div class="visor">
              <h3 data-i18n="vista.verBordes"></h3>
              <div class="marco"><canvas id="canvas-ver-bordes"></canvas></div>
            </div>
            <div class="visor">
              <h3 data-i18n="vista.verEntrada"></h3>
              <div class="marco"><canvas id="canvas-ver-entrada"></canvas></div>
            </div>
          </div>
          <div class="info" id="info-ver"></div>
        </div>

        <div class="tarjeta" id="vista-bloques">
          <div class="fila">
            <strong data-i18n="vista.bloquesTitulo"></strong>
            <span class="nota" data-i18n="vista.bloquesNota"></span>
          </div>
          <div class="visores-mini">
            <div class="visor">
              <h3 data-i18n="vista.bloquesAntes"></h3>
              <div class="marco"><canvas id="canvas-bloques-antes"></canvas></div>
            </div>
            <div class="visor">
              <h3 data-i18n="vista.bloquesMapa"></h3>
              <div class="marco"><canvas id="canvas-bloques-mapa"></canvas></div>
            </div>
          </div>
          <div class="info" id="info-bloques"></div>
        </div>

        <div class="tarjeta" id="vista-mascaras">
          <div class="fila">
            <strong data-i18n="vista.mascarasTitulo"></strong>
            <span class="nota" data-i18n="mascaras.nota"></span>
          </div>
          <div class="visores-mini">
            <div class="visor">
              <h3><span class="canal r">R</span> <span data-i18n="canal.metallic"></span></h3>
              <div class="marco"><canvas id="canvas-m-metallic"></canvas></div>
            </div>
            <div class="visor">
              <h3><span class="canal g">G</span> <span data-i18n="canal.smoothness"></span></h3>
              <div class="marco"><canvas id="canvas-m-smoothness"></canvas></div>
            </div>
            <div class="visor">
              <h3><span class="canal b">B</span> <span data-i18n="canal.emisivo"></span></h3>
              <div class="marco"><canvas id="canvas-m-emisivo"></canvas></div>
            </div>
            <div class="visor">
              <h3 data-i18n="vista.mezcla"></h3>
              <div class="marco"><canvas id="canvas-mezcla"></canvas></div>
            </div>
          </div>
          <div class="info" id="info-mascaras"></div>
        </div>
      </div>

      <div class="tarjeta">
        <div class="fila">
          <label data-i18n="salida.sufijo"></label>
          <input type="text" id="in-sufijo" value="_rp" style="flex:0 0 auto;width:84px" spellcheck="false">
          <label id="etiqueta-sufijo-mascara" data-i18n="salida.sufijoMascara"></label>
          <input type="text" id="in-sufijo-mascara" value="_mask" style="flex:0 0 auto;width:84px" spellcheck="false">
          <span style="flex:1"></span>
          <button class="boton primario icono" id="btn-descargar" data-icono="descargar" data-i18n-title="salida.descargarTitulo" disabled></button>
          <button class="boton primario icono" id="btn-descargar-zip" data-icono="zip" data-i18n-title="salida.zipTitulo" disabled></button>
        </div>
        <div id="aviso"></div>
      </div>
    </div>
  </div>
</div>

<div id="estado"></div>

<script src="idiomas.js"></script>
<script src="logica.js"></script>
<script src="app.js"></script>
</body>
</html>
